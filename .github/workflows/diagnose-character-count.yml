name: Diagnose character count
on:
  push:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect index
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          names=['突撃ハーランド木下','異常木下','吉田']
          print('REWARD_NAMES', {n:s.count(n) for n in names})
          print('CARDS_LENGTH', s.count('cards.length'))
          for needle in ['20','owned','所持','キャラ数','characterCount','MAX_CHARS','cards.slice']:
            print('\n###',needle)
            p=0;n=0
            while True:
              p=s.find(needle,p)
              if p<0 or n>=40: break
              print(s[max(0,p-100):p+180].replace('\n',' '))
              p+=len(needle);n+=1
          PY
      - name: Remove diagnostic workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/diagnose-character-count.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary character count diagnostic workflow'
          git push
